# Serviço "coletores" do Railway (Root Directory = collectors): cron job.
# Variável: DATABASE_URL (referência ao mesmo Postgres do serviço web).
# O processo roda todos os coletores em sequência e termina; o Railway o agenda.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "python run_all.py"
# 09:00 UTC = 06:00 em Pouso Alegre (UTC−3). Aos domingos a autoria de
# proposições faz varredura completa (ver run_all.py).
cronSchedule = "0 9 * * *"
restartPolicyType = "NEVER"
