# Coletores do Radar PA: rodam todo dia e gravam direto no Postgres (Neon).
# Segredo necessário no repositório: DATABASE_URL (string de conexão DIRETA do Neon,
# sem "-pooler" no host). Rodar na hora: aba Actions > Coletores > Run workflow.
name: Coletores

on:
  schedule:
    # 09:00 UTC = 06:00 em Pouso Alegre (UTC−3). O GitHub pode atrasar alguns minutos.
    # Aos domingos a autoria de proposições faz varredura completa (ver run_all.py).
    - cron: "0 9 * * *"
  workflow_dispatch:

# Nunca duas coletas ao mesmo tempo; uma nova espera a anterior terminar.
concurrency:
  group: coletores
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    # A primeira carga leva ~30 min (backfill); as seguintes, poucos minutos.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: collectors/.python-version
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r requirements.txt
      - run: python run_all.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
