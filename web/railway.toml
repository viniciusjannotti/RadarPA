# Serviço "web" do Railway (Root Directory = web).
# Variáveis: DATABASE_URL (referência ao Postgres do projeto), ADMIN_PASSWORD, JWT_SECRET.
# O Railway define PORT; `next start` usa PORT e NODE_ENV=production automaticamente.

[build]
builder = "RAILPACK"
# --include=dev: o build precisa de prisma/tsx/typescript mesmo com NODE_ENV=production.
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
# Migrations antes de trocar a versão no ar (falhou → o deploy não sobe).
preDeployCommand = "npx prisma migrate deploy"
startCommand = "npm run start"
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
